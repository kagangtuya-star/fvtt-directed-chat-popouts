name: Check, Test and Package

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - name: Build local artifacts
        if: github.event_name != 'release'
        run: npm run build
      - name: Build release artifacts
        if: github.event_name == 'release'
        run: npm run build
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: directed-chat-popouts
          path: dist/

  upload-release:
    if: github.event_name == 'release'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: directed-chat-popouts
          path: dist/
      - name: Upload release files
        run: gh release upload "$RELEASE_TAG" dist/module.json dist/directed-chat-popouts.zip dist/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
